sonar.projectKey=alfredo1996_neoboard
sonar.organization=alfredo1996
sonar.projectName=NeoBoard

# Sources
sonar.sources=app/src,component/src,connection/src,cli/src,connector-sdk/src

# Tests
sonar.tests=app/src,component/src,connection/__tests__,cli/src,connector-sdk/__tests__

# Only scan these three packages — everything else (scripts/, stress/, docker/, etc.) is excluded
sonar.exclusions=\
  **/node_modules/**,\
  **/__tests__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/*.d.ts,\
  **/coverage/**,\
  **/.next/**,\
  **/dist/**,\
  **/storybook-static/**,\
  **/*.stories.*,\
  scripts/**,\
  stress/**,\
  docker/**,\
  claude_code_docs/**,\
  docs/**

sonar.test.inclusions=\
  **/__tests__/**/*.test.ts,\
  **/__tests__/**/*.test.tsx,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx

# Files where coverage measurement is not meaningful.
#
# Every entry here was measured against the merged unit + E2E report before
# being kept: each has ZERO measurable lines, so excluding it changes no
# number and only spares the reader a row of "0/0".
#
# The rest of this list was removed in #1605. It had grown to hold code that
# measures perfectly well — 14 page components at 62%, auth/config.ts at 85%,
# the query hooks at 61-100% — which flattered the reported figure by 3.7
# points and, worse, made those files invisible to the new-code gate: a change
# to connections/page.tsx could not trip a coverage rule no matter what it did.
#
# Before adding an entry, measure it. "It has no tests" is a reason to write
# one, not to stop counting it.
sonar.coverage.exclusions=\
  app/src/middleware.ts,\
  app/src/types/**,\
  app/src/components/parameters/index.ts,\
  app/src/plugins/*/index.ts,\
  component/src/lib/cypher-lang/**

# Coverage — lcov reports from all packages. connection runs coverage in two
# passes (parallel unit/integration → coverage/, then the serial quality suite
# → coverage-quality/); both are listed so Sonar aggregates them instead of the
# second pass overwriting the first.
sonar.javascript.lcov.reportPaths=\
  app/coverage/lcov.info,\
  app/coverage-e2e/lcov.info,\
  component/coverage/lcov.info,\
  connection/coverage/lcov.info,\
  connection/coverage-quality/lcov.info,\
  cli/coverage/lcov.info,\
  connector-sdk/coverage/lcov.info

# TypeScript configs
sonar.typescript.tsconfigPath=app/tsconfig.json

# Security hotspot suppressions — CLI tool (local dev tooling, not a server)
# S4721: execSync with hardcoded commands (no user input interpolation)
# S4036: PATH resolution for docker binary (trusted local PATH)
sonar.issue.ignore.multicriteria=cli_cmd,cli_path
sonar.issue.ignore.multicriteria.cli_cmd.ruleKey=typescript:S4721
sonar.issue.ignore.multicriteria.cli_cmd.resourceKey=cli/src/lib/exec.ts
sonar.issue.ignore.multicriteria.cli_path.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.cli_path.resourceKey=cli/src/lib/exec.ts

# Encoding
sonar.sourceEncoding=UTF-8
