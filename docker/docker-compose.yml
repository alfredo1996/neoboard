# Dev databases only — PostgreSQL + Neo4j. `neoboard start` brings these up;
# pair them with `npm run dev`, which runs the app from source on the host.
# For demo users, connections and dashboards, run `neoboard demo`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: neoboard-postgres
    environment:
      POSTGRES_USER: neoboard
      POSTGRES_PASSWORD: neoboard
      POSTGRES_DB: neoboard
    ports:
      - "${NEOBOARD_PORT_POSTGRES:-5432}:5432"
    volumes:
      - neoboard_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: neoboard-neo4j
    environment:
      NEO4J_AUTH: neo4j/neoboard123
      # Advertise Docker hostname so the neo4j:// routing driver works from other containers
      NEO4J_server_default__advertised__address: neoboard-neo4j
      # Log every query to query.log, so a slow or unexpected dashboard
      # query can be read back. View with:
      #   docker exec neoboard-neo4j tail -f /logs/query.log
      NEO4J_dbms_logs_query_enabled: "INFO"
      NEO4J_dbms_logs_query_threshold: "0ms"
    ports:
      - "${NEOBOARD_PORT_NEO4J_HTTP:-7474}:7474"
      - "${NEOBOARD_PORT_NEO4J_BOLT:-7687}:7687"
    volumes:
      - neoboard_neo4jdata:/data
      - ./neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neoboard123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  neoboard_pgdata:
  neoboard_neo4jdata: