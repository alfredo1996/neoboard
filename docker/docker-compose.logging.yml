# Log shipping add-on: Fluent Bit + single-node OpenSearch + OpenSearch
# Dashboards. Not standalone: layer it on a production compose file.
#
#   docker compose --env-file docker/.env.production.local \
#     -f docker/docker-compose.prod-full.yml -f docker/docker-compose.logging.yml up -d
#
# Works the same with docker-compose.prod.yml. Dashboards: http://localhost:5601
# (create the index pattern `neoboard-*`). OpenSearch runs WITHOUT its security
# plugin and every port is bound to 127.0.0.1: for a laptop or a trusted
# single server. Put authentication in front before exposing any of them.
# Retention: 14 days, set by deploy/opensearch/ism-neoboard-14d.json.
services:
  neoboard:
    # Docker's dual logging keeps `docker logs neoboard` working. Async, so the
    # app starts even when Fluent Bit is down. Compose replaces the logging
    # block whole when the driver differs, so the base file's json-file size
    # options do not leak in.
    logging:
      driver: fluentd
      options:
        fluentd-address: "127.0.0.1:24224"
        fluentd-async: "true"
        tag: neoboard

  fluent-bit:
    image: fluent/fluent-bit:5.1.3
    environment:
      OPENSEARCH_HOST: opensearch
      OPENSEARCH_PORT: "9200"
    volumes:
      - ../deploy/fluent-bit:/fluent-bit/etc:ro
    # The Docker daemon, not the app container, connects to this port.
    ports:
      - "127.0.0.1:24224:24224"
    depends_on:
      - opensearch
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "127.0.0.1:${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      - opensearchdata:/usr/share/opensearch/data
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    deploy:
      resources:
        limits:
          memory: 1G
    restart: unless-stopped

  # One-shot: installs the 14-day retention policy, then exits.
  opensearch-init:
    image: curlimages/curl:8.10.1
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - ../deploy/opensearch:/policy:ro
    command:
      - -fsS
      - -X
      - PUT
      - -H
      - "Content-Type: application/json"
      - --data-binary
      - "@/policy/ism-neoboard-14d.json"
      - http://opensearch:9200/_plugins/_ism/policies/neoboard-14d
    restart: "no"

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.17.1
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "127.0.0.1:${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768M
    restart: unless-stopped

volumes:
  opensearchdata:
