# Full-stack local deployment: NeoBoard app + PostgreSQL + Neo4j
# Usage: docker compose -f docker/docker-compose.full.yml up --build
#
# After first start, run migrations + seed:
#   docker compose -f docker/docker-compose.full.yml exec neoboard \
#     node -e "console.log('Ready — run setup script or access http://localhost:3000')"
services:
  postgres:
    image: postgres:16-alpine
    container_name: neoboard-postgres
    environment:
      POSTGRES_USER: neoboard
      POSTGRES_PASSWORD: neoboard
      POSTGRES_DB: neoboard
    ports:
      - "5432:5432"
    volumes:
      - neoboard_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5-community
    container_name: neoboard-neo4j
    environment:
      NEO4J_AUTH: neo4j/neoboard123
      # Advertise Docker hostname so the routing driver connects correctly
      NEO4J_server_default__advertised__address: neoboard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neoboard_neo4jdata:/data
      - ./neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neoboard123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  neoboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: neoboard-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://neoboard:neoboard@postgres:5432/neoboard
      ENCRYPTION_KEY: b8c0dbaad415694973d7cf4a3a40d4e53fc940493a6362ecff4dae45245e05d9
      NEXTAUTH_SECRET: d0eece19938fc5e2e3e45ed76fb5c92b0fc6ba2c4f213404ccca7ea0e641cd65
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: unless-stopped

volumes:
  neoboard_pgdata:
  neoboard_neo4jdata:
