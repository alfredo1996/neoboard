# Full-stack self-contained deployment: NeoBoard app + PostgreSQL + Neo4j.
#
# This file bundles the application AND its databases into a single compose
# stack. Use it for quick demos, evaluation, or the CLI (`neoboard start --full`).
#
# How the three compose files relate:
#   docker-compose.yml      — Dev databases only (Postgres + Neo4j). Pair with `npm run dev`.
#   docker-compose.prod.yml — App container only. Expects an external database via env vars.
#   docker-compose.full.yml — (this file) App + databases. One command, nothing else needed.
#
# Usage:
#   docker compose -f docker/docker-compose.full.yml up --build
#
# After first start, open http://localhost:3000 to complete setup.
services:
  postgres:
    image: postgres:16-alpine
    container_name: neoboard-postgres
    environment:
      POSTGRES_USER: neoboard
      POSTGRES_PASSWORD: neoboard
      POSTGRES_DB: neoboard
    ports:
      - "5432:5432"
    volumes:
      - neoboard_pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neoboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5.26-community
    container_name: neoboard-neo4j
    environment:
      NEO4J_AUTH: neo4j/neoboard123
      # Advertise Docker hostname so the routing driver connects correctly
      NEO4J_server_default__advertised__address: neoboard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neoboard_neo4jdata:/data
      - ./neo4j/init.cypher:/var/lib/neo4j/import/init.cypher
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "neoboard123", "RETURN 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  neoboard:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: neoboard-app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://neoboard:neoboard@postgres:5432/neoboard
      # Per-install secrets — generated into docker/.env by the CLI
      # (`neoboard start`/`demo`); compose loads it via --env-file. Set
      # the variables in your environment to override (CI does this).
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?missing — run `neoboard start`/`demo` (generates docker/.env) or set it}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?missing — run `neoboard start`/`demo` (generates docker/.env) or set it}
      NEXTAUTH_URL: http://localhost:3000
      API_KEY_HMAC_SECRET: ${API_KEY_HMAC_SECRET:?missing — run `neoboard start`/`demo` (generates docker/.env) or set it}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      # HTTP probe against the app's /api/health endpoint. The start_period
      # is generous because the first request runs `next start` cold + warms
      # up the Drizzle pool, which can take ~20s on a fresh image.
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  neoboard_pgdata:
  neoboard_neo4jdata:
