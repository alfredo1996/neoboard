# NeoBoard log shipping for Docker: Docker's fluentd log driver -> Fluent Bit
# -> OpenSearch. The Kubernetes variant is deploy/kubernetes/fluent-bit-values.yaml.
# To ship somewhere else, replace the [OUTPUT] block only (see the monitoring docs).
[SERVICE]
    Flush        1
    Log_Level    info
    Parsers_File parsers.conf
    # Chunks wait on disk (the named volume in docker-compose.logging.yml)
    # while OpenSearch is down, so a long outage loses nothing until the cap
    # below, storage.total_limit_size on the output.
    storage.path /fluent-bit/buffer

[INPUT]
    Name   forward
    Listen 0.0.0.0
    Port   24224
    storage.type filesystem

@INCLUDE filters.conf

# One index per day, neoboard-YYYY.MM.DD, kept 14 days by the ISM policy in
# deploy/opensearch/. Logstash_Format stamps @timestamp with the event time.
[OUTPUT]
    Name                 opensearch
    Match                *
    Host                 ${OPENSEARCH_HOST}
    Port                 ${OPENSEARCH_PORT}
    Logstash_Format      On
    Logstash_Prefix      neoboard
    Suppress_Type_Name   On
    Trace_Error          On
    # Retry until OpenSearch is back. The ceiling is the disk cap: past it the
    # oldest chunks are dropped, so disk use stays bounded.
    Retry_Limit          no_limits
    storage.total_limit_size 1G
    # A stable _id, so a retried bulk request overwrites instead of duplicating.
    Generate_ID          On
