# The filters of the Docker pipeline, shared with lua-check.conf so that the
# check runs the real ones.
# Docker splits a line over 16 KB into partial messages; join them before
# parsing. (On Kubernetes the tail input's `cri` / `docker` multiline parsers
# do this.)
# The app writes one JSON object per line; the driver delivers it as a string
# under `log`. A line that is not JSON (a startup banner) passes through as is.
[FILTER]
    Name                  multiline
    Match                 *
    multiline.key_content log
    mode                  partial_message

[FILTER]
    Name          parser
    Match         *
    Key_Name      log
    Parser        neoboard_json
    Reserve_Data  On

[FILTER]
    Name   lua
    Match  *
    Script neoboard.lua
    Call   neoboard
    time_as_table On
