# Runs the real filters (filters.conf) on four synthetic Docker records and
# prints them; check.sh asserts on the output.
[SERVICE]
    Flush        0.2
    Grace        1
    Parsers_File parsers.conf

[INPUT]
    Name    dummy
    Tag     a
    Samples 1
    Dummy   {"log":"{\"level\":50,\"time\":1700000000123,\"err\":\"boom\"}"}

[INPUT]
    Name    dummy
    Tag     b
    Samples 1
    Dummy   {"log":"{\"level\":40,\"time\":1700000000456,\"err\":{\"message\":\"x\",\"type\":\"Error\"}}"}

[INPUT]
    Name    dummy
    Tag     c
    Samples 1
    Dummy   {"log":"{\"level\":30,\"msg\":\"no time or err\"}"}

[INPUT]
    Name    dummy
    Tag     d
    Samples 1
    Dummy   {"log":"plain text","time":"2023-11-14T22:13:20.789Z"}

@INCLUDE filters.conf

[OUTPUT]
    Name             stdout
    Match            *
    Format           json_lines
    json_date_key    date
    json_date_format iso8601
