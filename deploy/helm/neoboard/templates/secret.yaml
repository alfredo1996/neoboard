{{- if not .Values.existingSecret }}
{{- range $k := list "DATABASE_URL" "ENCRYPTION_KEY" "NEXTAUTH_SECRET" "API_KEY_HMAC_SECRET" }}
{{- if not (index $.Values.secrets $k) }}{{ fail (printf "secrets.%s is required (or set existingSecret)" $k) }}{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "neoboard.fullname" . }}
  labels: {{- include "neoboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $k, $v := .Values.secrets }}
  {{- if $v }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
