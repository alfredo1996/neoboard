{{- if and .Values.metrics.enabled (not .Values.metrics.tokenSecret.name) }}{{ fail "metrics.tokenSecret.name is required when metrics.enabled" }}{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "neoboard.fullname" . }}
  labels: {{- include "neoboard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "neoboard.selector" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "neoboard.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: neoboard
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: {{ include "neoboard.fullname" . }}
            - secretRef:
                name: {{ include "neoboard.secretName" . }}
          {{- if or .Values.metrics.enabled .Values.extraEnv }}
          env:
            {{- if .Values.metrics.enabled }}
            - name: METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.metrics.tokenSecret.name }}
                  key: {{ .Values.metrics.tokenSecret.key }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          # The Host header is pinned: the app's HTTPS redirect exempts only
          # localhost and RFC1918 hosts, so a pod IP on IPv6 or 100.64/10 would get a 301.
          startupProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            {{- toYaml .Values.probes.startup | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: localhost
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          livenessProbe:
            tcpSocket:
              port: http
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
