version: 2
updates:
  # ── npm workspaces ────────────────────────────────────────────────────────
  # This is an npm-workspaces monorepo: the root package.json declares
  # ["app", "component", "connector-sdk", "connection", "cli"] and there is
  # exactly ONE package-lock.json, at the repo root.
  #
  # Dependabot must therefore run from `/`. Pointing it at /app or /component
  # (as it did until #1427) let it edit a workspace package.json without being
  # able to regenerate the root lock, so every PR it opened died at `npm ci`:
  #
  #   npm error `npm ci` can only install packages when your package.json and
  #   npm error package-lock.json are in sync.
  #   npm error Missing: typescript@7.0.2 from lock file
  #
  # One entry at the root also covers connector-sdk and cli, which the
  # per-package entries never watched at all.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # Five workspaces now share one entry, so the previous per-package limit of
    # 5 would be a tighter budget than before, not a looser one.
    open-pull-requests-limit: 10
    ignore:
      # Tailwind v4 is a framework migration, not a dependency bump: new config
      # model, and NeoBoard ships a custom tailwind-preset.cjs consumed by both
      # app/ and component/. It is scheduled as its own work item with a visual
      # review in both themes — see the "Tailwind v4 deferred" decision.
      # Without this ignore the same PR returns every week (#1231, #1232).
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]

      # react-table v9 is an API migration, not a bump: `features` becomes a
      # required static registry (our six row models are per-render prop
      # toggles), every core type gains TFeatures as its first generic, and
      # getIsSomeRowsSelected() silently flips meaning — which breaks the
      # select-all indeterminate checkbox with no compile error. #1489 measured
      # 71 type errors in component/ alone before the job even reached app/.
      # Deferred until the v1.6 a11y cluster lands — see #1498.
      - dependency-name: "@tanstack/react-table"
        update-types: [version-update:semver-major]

  # ── docs site ─────────────────────────────────────────────────────────────
  # docs/ is NOT a workspace — it has its own package-lock.json, so it needs its
  # own entry. It was unwatched entirely before #1427.
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # ── GitHub Actions ────────────────────────────────────────────────────────
  # Action bumps touch no lockfile, which is why they were the only dependabot
  # PRs that reached a green build before #1427.
  #
  # Majors only. This repo pins actions by FLOATING MAJOR TAG — 43 of 45 uses
  # are `@vN` — so a `@v4` reference already receives every patch and minor
  # automatically. Left unfiltered, dependabot still proposes `@v4` -> `@v4.5.2`
  # (#1429, #1432), which would pin two actions out of 45 to an exact patch,
  # break the convention, and open a PR on every future patch release.
  #
  # It buys nothing in return: `@v4.5.2` is a mutable git tag exactly like
  # `@v4`. Real supply-chain pinning needs a full commit SHA, which would be a
  # deliberate pass across all 45 references, not a drive-by on two.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
