name: CLI Integration

on:
  push:
    branches: [main, dev, "release/*"]
    paths:
      - "cli/**"
      - "docker/**"
      - "scripts/seed-demo.mjs"
      - "scripts/demo/**"
      - "Dockerfile"
      # connector-sdk's `prepare` runs during the Dockerfile's deps-stage
      # `npm ci`, which has only the package manifests — no source. An
      # unguarded prepare there fails the image build outright (#1356), and
      # this is the only job that builds the image outside a release.
      - "connector-sdk/package.json"
      - "scripts/web-installer.sh"
      - "scripts/assemble-installer-assets.sh"
      - ".github/workflows/cli-integration.yml"
  pull_request:
    branches: [main, dev, "release/*"]
    paths:
      - "cli/**"
      - "docker/**"
      - "scripts/seed-demo.mjs"
      - "scripts/demo/**"
      - "Dockerfile"
      - "connector-sdk/package.json"
      - "scripts/web-installer.sh"
      - "scripts/assemble-installer-assets.sh"
      - ".github/workflows/cli-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-integration:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Deliberately does NOT build connector-sdk first (#1356). `connection`
      # cannot compile without `connector-sdk/dist`, and that directory is now
      # produced by connector-sdk's `prepare` script during `npm ci` above.
      # Open-coding the prerequisite here would still pass if `prepare` were
      # removed — which is the regression worth catching, since it is what
      # every fresh clone and worktree hits. So this step doubles as the check
      # that a plain `npm ci` leaves the tree buildable.
      #
      # No `continue-on-error`: it previously hid the fact that this step had
      # never once succeeded (42 TS2307, exit 1, on every run since it landed).
      - name: Build connection package
        run: npm -w connection run build

      - name: Generate env files (app/.env.local + docker/.env)
        run: |
          cat > app/.env.local <<'ENVEOF'
          DATABASE_URL=postgresql://neoboard:neoboard@localhost:5432/neoboard
          ENCRYPTION_KEY=b8c0dbaad415694973d7cf4a3a40d4e53fc940493a6362ecff4dae45245e05d9
          NEXTAUTH_SECRET=d0eece19938fc5e2e3e45ed76fb5c92b0fc6ba2c4f213404ccca7ea0e641cd65
          NEXTAUTH_URL=http://localhost:3000
          API_KEY_HMAC_SECRET=7f3b9c2a5e8d4f1b0a6c9e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a
          ENVEOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' app/.env.local
          # docker-compose.full.yml interpolates these from docker/.env (the
          # file `neoboard start`/`demo` generates). CI starts the stack with
          # raw `docker compose up`, so generate it here with the SAME secrets
          # as app/.env.local — otherwise compose fails on the required
          # ${API_KEY_HMAC_SECRET:?} interpolation and seeded connectors would
          # be encrypted with a divergent key (#1039).
          cat > docker/.env <<'ENVEOF'
          ENCRYPTION_KEY=b8c0dbaad415694973d7cf4a3a40d4e53fc940493a6362ecff4dae45245e05d9
          NEXTAUTH_SECRET=d0eece19938fc5e2e3e45ed76fb5c92b0fc6ba2c4f213404ccca7ea0e641cd65
          API_KEY_HMAC_SECRET=7f3b9c2a5e8d4f1b0a6c9e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a
          ENVEOF
          sed -i 's/^          //' docker/.env

      - name: Start full stack
        run: |
          FORCE_HTTPS=false docker compose \
            -f docker/docker-compose.full.yml up -d --build

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker exec neoboard-postgres pg_isready -U neoboard; do sleep 2; done'
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until [ "$(docker inspect --format={{.State.Health.Status}} neoboard-neo4j 2>/dev/null)" = healthy ]; do sleep 5; done'
          echo "Waiting for NeoBoard app..."
          timeout 90 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/auth/csrf | grep -q 200; do sleep 3; done'
          echo "loopback disable_ipv6 (0 = IPv6 on, the Engine 29 case):" "$(docker exec neoboard-app cat /proc/sys/net/ipv6/conf/lo/disable_ipv6)"
          echo "Waiting for the app container health check..."
          timeout 60 bash -c 'until [ "$(docker inspect --format={{.State.Health.Status}} neoboard-app 2>/dev/null)" = healthy ]; do sleep 3; done'
          docker exec neoboard-app wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health
          echo "All services ready"

      - name: Seed demo data
        run: |
          NEO4J_HOST=neoboard-neo4j \
          PG_HOST=neoboard-postgres \
          node scripts/seed-demo.mjs

      - name: Run CLI integration tests
        run: npm -w cli run test:integration

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== neoboard-app ==="
          docker logs neoboard-app 2>&1 | tail -50
          echo "=== neoboard-postgres ==="
          docker logs neoboard-postgres 2>&1 | tail -20
          echo "=== neoboard-neo4j ==="
          docker logs neoboard-neo4j 2>&1 | tail -20

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.full.yml down -v 2>/dev/null || true

  clean-clone-install:
    name: Clean-clone install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Guards #1309: `bash install.sh` failed on every fresh clone because
    # install.sh passed `--prefix "$ROOT_DIR"`, which npm treats as the GLOBAL
    # install location and leaks into lifecycle scripts — so the root
    # postinstall's `npm link ./cli` tried to write "$ROOT_DIR/lib".
    #
    # This break was invisible to everyone: existing working copies already
    # have node_modules and the link, and the postinstall short-circuits on
    # `[ -n "$CI" ]`. Only a clean clone with CI unset reaches it, which is
    # exactly what this job does.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Clone into a pristine directory
        run: git clone --no-hardlinks . "$RUNNER_TEMP/clean-clone"

      - name: Run install.sh exactly as a new user does
        # `env -u CI` is load-bearing: with CI set, postinstall short-circuits
        # and the npm link path — the thing that broke — never runs.
        run: env -u CI NEOBOARD_BOOTSTRAP_ONLY=1 bash install.sh
        working-directory: ${{ runner.temp }}/clean-clone

      - name: Assert the CLI is built and linked
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/clean-clone/cli/dist/index.js" \
            || { echo "::error::install.sh did not build cli/dist/index.js"; exit 1; }
          command -v neoboard >/dev/null \
            || { echo "::error::install.sh did not put 'neoboard' on PATH"; exit 1; }
          neoboard --version

  web-installer:
    name: One-line web installer
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Guards #1314: `curl ... install.sh | sh` must end in a running NeoBoard on
    # a machine with only Docker. Everything a release would do is done here
    # from the PR instead: build the linux-x64 binary, assemble install.sh and
    # SHA256SUMS with the same script release.yml runs, serve them locally, and
    # run the script against an image built from this checkout.
    #
    # What only a tag can prove: the other three platforms' binaries (the
    # build-cli-binaries workflow builds them on every PR, but nothing runs
    # them here), the real github.com download URLs, and the published image.
    env:
      VERSION: 0.0.0-ci
      PORT: "8977"
      NEOBOARD_RELEASES_URL: http://127.0.0.1:8977
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the CLI's build dependencies
        run: npm ci --workspace=cli --ignore-scripts

      - name: Choose the paths
        run: |
          {
            echo "ASSETS=$RUNNER_TEMP/serve/download/v$VERSION"
            echo "NEOBOARD_BIN_DIR=$RUNNER_TEMP/bin"
            echo "NEOBOARD_DIR=$RUNNER_TEMP/neoboard"
          } >> "$GITHUB_ENV"

      - name: Build the binary and assemble the release assets
        run: |
          mkdir -p "$ASSETS"
          node cli/scripts/build-sea.mjs --version "$VERSION" --out "$ASSETS/neoboard-linux-x64"
          sh scripts/assemble-installer-assets.sh "$VERSION" "$ASSETS"

      # Tagged exactly as install.sh pins it, so compose finds it locally and
      # pulls nothing from ghcr.
      - name: Build the image from this checkout
        run: docker build -t "ghcr.io/alfredo1996/neoboard:$VERSION" .

      - name: Serve the assets
        run: |
          python3 -m http.server "$PORT" --bind 127.0.0.1 --directory "$RUNNER_TEMP/serve" >/dev/null 2>&1 &
          echo "SERVER_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 20); do
            curl -fs "$NEOBOARD_RELEASES_URL/download/v$VERSION/SHA256SUMS" >/dev/null && exit 0
            sleep 1
          done
          echo "::error::the local asset server did not start"; exit 1

      - name: A tampered checksum or binary fails the install and installs nothing
        run: |
          set -uo pipefail
          cp "$ASSETS/SHA256SUMS" "$RUNNER_TEMP/sums.good"
          cp "$ASSETS/neoboard-linux-x64" "$RUNNER_TEMP/bin.good"

          # A fixed wrong hash, not "change the first character": a hash that
          # already starts with that character would be left as it was.
          printf '%064d  neoboard-linux-x64\n' 0 > "$ASSETS/SHA256SUMS"
          ! cmp -s "$ASSETS/SHA256SUMS" "$RUNNER_TEMP/sums.good" \
            || { echo "::error::the tamper step did not change the sums"; exit 1; }
          if sh "$ASSETS/install.sh" > "$RUNNER_TEMP/tamper1.out" 2>&1; then
            echo "::error::a wrong checksum did not fail the install"; exit 1
          fi
          grep -q 'checksum mismatch' "$RUNNER_TEMP/tamper1.out" \
            || { cat "$RUNNER_TEMP/tamper1.out"; echo "::error::no checksum message"; exit 1; }
          cp "$RUNNER_TEMP/sums.good" "$ASSETS/SHA256SUMS"

          echo tampered >> "$ASSETS/neoboard-linux-x64"
          if sh "$ASSETS/install.sh" > "$RUNNER_TEMP/tamper2.out" 2>&1; then
            echo "::error::a swapped binary did not fail the install"; exit 1
          fi
          cp "$RUNNER_TEMP/bin.good" "$ASSETS/neoboard-linux-x64"

          test ! -e "$NEOBOARD_BIN_DIR/neoboard" \
            || { echo "::error::a failed install left a binary behind"; exit 1; }
          test ! -e "$NEOBOARD_DIR/docker/.env" \
            || { echo "::error::a failed install reached setup"; exit 1; }

      - name: With no Docker the message says what to do
        run: |
          set -uo pipefail
          bare="$RUNNER_TEMP/nodocker"
          mkdir -p "$bare"
          for t in uname curl awk grep cut mktemp mkdir chmod mv rm sha256sum dirname; do
            ln -sf "$(command -v "$t")" "$bare/$t"
          done
          if PATH="$bare" /bin/sh "$ASSETS/install.sh" > "$RUNNER_TEMP/nodocker.out" 2>&1; then
            echo "::error::the install passed without Docker"; exit 1
          fi
          grep -q 'Docker is not installed. Install Docker Engine' "$RUNNER_TEMP/nodocker.out" \
            || { cat "$RUNNER_TEMP/nodocker.out"; echo "::error::the no-Docker message is wrong"; exit 1; }

      - name: Clean install, piped to sh as a stranger would
        run: |
          curl -fsSL "$NEOBOARD_RELEASES_URL/download/v$VERSION/install.sh" | sh 2>&1 | tee "$RUNNER_TEMP/install.out"

      - name: The app is up on the pinned image and the printed token is the one it expects
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = 200
          test "$(docker inspect neoboard-app --format '{{.Config.Image}}')" = "ghcr.io/alfredo1996/neoboard:$VERSION"
          grep -qx "NEOBOARD_IMAGE=ghcr.io/alfredo1996/neoboard:$VERSION" "$NEOBOARD_DIR/docker/.env"
          token=$(sed -n 's/^.*Token: *\([0-9a-f]\{64\}\).*$/\1/p' "$RUNNER_TEMP/install.out" | head -1)
          test -n "$token" || { echo "::error::the banner printed no token"; exit 1; }
          test "$(docker exec neoboard-app printenv ADMIN_BOOTSTRAP_TOKEN)" = "$token"
          curl -s http://localhost:3000/api/auth/bootstrap-status | grep -q '"bootstrapRequired":true'

      - name: A second run leaves .env untouched
        run: |
          set -euo pipefail
          before=$(sha256sum "$NEOBOARD_DIR/docker/.env")
          sh "$ASSETS/install.sh" 2>&1 | tee "$RUNNER_TEMP/rerun.out"
          test "$(sha256sum "$NEOBOARD_DIR/docker/.env")" = "$before"
          grep -q 'Keeping the installed' "$RUNNER_TEMP/rerun.out"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/health)" = 200

      # From a directory that is not the install and with NEOBOARD_DIR unset:
      # the CLI has to find the install the way a user's next terminal would,
      # through the directory `setup` recorded.
      - name: stop and logs work from anywhere, on the compose files the binary staged
        run: |
          set -euo pipefail
          elsewhere="$RUNNER_TEMP/elsewhere"
          mkdir -p "$elsewhere"
          cd "$elsewhere"
          nb() { env -u NEOBOARD_DIR "$NEOBOARD_BIN_DIR/neoboard" "$@"; }
          nb logs -n 5 postgres > "$RUNNER_TEMP/logs.out" 2>&1 \
            || { cat "$RUNNER_TEMP/logs.out"; echo "::error::neoboard logs failed"; exit 1; }
          test -s "$RUNNER_TEMP/logs.out"
          nb stop
          test ! -e "$elsewhere/neoboard" \
            || { echo "::error::a second install was created beside the user's directory"; exit 1; }
          # The databases-only compose file shares the project, so stopping
          # with it also removed the app container.
          if docker inspect neoboard-app >/dev/null 2>&1; then
            echo "::error::neoboard stop left the app container running"; exit 1
          fi
          test -f "$NEOBOARD_DIR/docker/.env"

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs neoboard-app 2>&1 | tail -50 || true
          docker ps -a

      - name: Cleanup
        if: always()
        run: |
          kill "$SERVER_PID" 2>/dev/null || true
          if [ -f "$NEOBOARD_DIR/docker/docker-compose.full.yml" ]; then
            docker compose -f "$NEOBOARD_DIR/docker/docker-compose.full.yml" --env-file "$NEOBOARD_DIR/docker/.env" down -v
          fi
