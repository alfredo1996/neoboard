name: CLI Integration

on:
  push:
    branches: [main, dev, 'release/*']
    paths:
      - 'cli/**'
      - 'docker/**'
      - 'scripts/seed-demo.mjs'
      - 'Dockerfile'
      # connector-sdk's `prepare` runs during the Dockerfile's deps-stage
      # `npm ci`, which has only the package manifests — no source. An
      # unguarded prepare there fails the image build outright (#1356), and
      # this is the only job that builds the image outside a release.
      - 'connector-sdk/package.json'
      - '.github/workflows/cli-integration.yml'
  pull_request:
    branches: [main, dev, 'release/*']
    paths:
      - 'cli/**'
      - 'docker/**'
      - 'scripts/seed-demo.mjs'
      - 'Dockerfile'
      - 'connector-sdk/package.json'
      - '.github/workflows/cli-integration.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-integration:
    name: CLI Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deliberately does NOT build connector-sdk first (#1356). `connection`
      # cannot compile without `connector-sdk/dist`, and that directory is now
      # produced by connector-sdk's `prepare` script during `npm ci` above.
      # Open-coding the prerequisite here would still pass if `prepare` were
      # removed — which is the regression worth catching, since it is what
      # every fresh clone and worktree hits. So this step doubles as the check
      # that a plain `npm ci` leaves the tree buildable.
      #
      # No `continue-on-error`: it previously hid the fact that this step had
      # never once succeeded (42 TS2307, exit 1, on every run since it landed).
      - name: Build connection package
        run: npm -w connection run build

      - name: Generate env files (app/.env.local + docker/.env)
        run: |
          cat > app/.env.local <<'ENVEOF'
          DATABASE_URL=postgresql://neoboard:neoboard@localhost:5432/neoboard
          ENCRYPTION_KEY=b8c0dbaad415694973d7cf4a3a40d4e53fc940493a6362ecff4dae45245e05d9
          NEXTAUTH_SECRET=d0eece19938fc5e2e3e45ed76fb5c92b0fc6ba2c4f213404ccca7ea0e641cd65
          NEXTAUTH_URL=http://localhost:3000
          API_KEY_HMAC_SECRET=7f3b9c2a5e8d4f1b0a6c9e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a
          ENVEOF
          # Remove leading whitespace from heredoc
          sed -i 's/^          //' app/.env.local
          # docker-compose.full.yml interpolates these from docker/.env (the
          # file `neoboard start`/`demo` generates). CI starts the stack with
          # raw `docker compose up`, so generate it here with the SAME secrets
          # as app/.env.local — otherwise compose fails on the required
          # ${API_KEY_HMAC_SECRET:?} interpolation and seeded connectors would
          # be encrypted with a divergent key (#1039).
          cat > docker/.env <<'ENVEOF'
          ENCRYPTION_KEY=b8c0dbaad415694973d7cf4a3a40d4e53fc940493a6362ecff4dae45245e05d9
          NEXTAUTH_SECRET=d0eece19938fc5e2e3e45ed76fb5c92b0fc6ba2c4f213404ccca7ea0e641cd65
          API_KEY_HMAC_SECRET=7f3b9c2a5e8d4f1b0a6c9e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a4b1c5e8d7f2a
          ENVEOF
          sed -i 's/^          //' docker/.env

      - name: Build Docker image
        run: docker build -t neoboard:integration-test .

      - name: Start full stack
        run: |
          # Use the built image instead of rebuilding
          FORCE_HTTPS=false docker compose -f docker/docker-compose.full.yml up -d
        env:
          COMPOSE_DOCKER_CLI_BUILD: 0

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for PostgreSQL..."
          timeout 60 bash -c 'until docker exec neoboard-postgres pg_isready -U neoboard; do sleep 2; done'
          echo "Waiting for Neo4j..."
          timeout 120 bash -c 'until docker inspect --format={{.State.Health.Status}} neoboard-neo4j 2>/dev/null | grep -q healthy; do sleep 5; done'
          echo "Waiting for NeoBoard app..."
          timeout 90 bash -c 'until curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/auth/csrf | grep -q 200; do sleep 3; done'
          echo "All services ready"

      - name: Run migrations
        run: |
          DATABASE_URL=postgresql://neoboard:neoboard@localhost:5432/neoboard \
            npx -w app drizzle-kit migrate

      - name: Seed demo data
        run: |
          NEO4J_HOST=neoboard-neo4j \
          PG_HOST=neoboard-postgres \
          node scripts/seed-demo.mjs

      - name: Run CLI integration tests
        run: npm -w cli run test:integration

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== neoboard-app ==="
          docker logs neoboard-app 2>&1 | tail -50
          echo "=== neoboard-postgres ==="
          docker logs neoboard-postgres 2>&1 | tail -20
          echo "=== neoboard-neo4j ==="
          docker logs neoboard-neo4j 2>&1 | tail -20

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.full.yml down -v 2>/dev/null || true

  clean-clone-install:
    name: Clean-clone install
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Guards #1309: `bash install.sh` failed on every fresh clone because
    # install.sh passed `--prefix "$ROOT_DIR"`, which npm treats as the GLOBAL
    # install location and leaks into lifecycle scripts — so the root
    # postinstall's `npm link ./cli` tried to write "$ROOT_DIR/lib".
    #
    # This break was invisible to everyone: existing working copies already
    # have node_modules and the link, and the postinstall short-circuits on
    # `[ -n "$CI" ]`. Only a clean clone with CI unset reaches it, which is
    # exactly what this job does.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Clone into a pristine directory
        run: git clone --no-hardlinks . "$RUNNER_TEMP/clean-clone"

      - name: Run install.sh exactly as a new user does
        # `env -u CI` is load-bearing: with CI set, postinstall short-circuits
        # and the npm link path — the thing that broke — never runs.
        run: env -u CI NEOBOARD_BOOTSTRAP_ONLY=1 bash install.sh
        working-directory: ${{ runner.temp }}/clean-clone

      - name: Assert the CLI is built and linked
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/clean-clone/cli/dist/index.js" \
            || { echo "::error::install.sh did not build cli/dist/index.js"; exit 1; }
          command -v neoboard >/dev/null \
            || { echo "::error::install.sh did not put 'neoboard' on PATH"; exit 1; }
          neoboard --version
