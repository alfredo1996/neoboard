# Close referenced issues when a PR merges into a non-default branch (#1853).
#
# GitHub acts on `Closes #N` only for the default branch (dev), so every
# release/* merge left its issues open and they were closed by hand.
#
# pull_request_target runs with this repository's token, so PRs from forks are
# handled too. That is safe only because the job runs no code from the
# repository or the PR:
#   - nothing is checked out. After the merge the base branch contains the PR's
#     own changes, so a checked-out script could be one the PR rewrote (#1858);
#   - the parser is the inline block below, fed the PR body through an env var;
#   - the shell loops only over the integers that parser prints;
#   - nothing is installed.
# GitHub loads a pull_request_target workflow from the DEFAULT branch (dev), and
# runs it only if the file exists there. So this does nothing until it reaches
# dev, and a PR into release/* cannot change what runs on its own merge. PRs into
# dev never reach the job (see `if`).
# scripts/__tests__/close-issues-workflow.test.mjs pins these rules, and
# scripts/__tests__/closing-refs.test.mjs runs the inline parser.
name: Close referenced issues

on:
  pull_request_target:
    types: [closed]

permissions:
  issues: write

jobs:
  close:
    name: Close referenced issues
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close each referenced issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          # GitHub's closing keywords: close/closes/closed, fix/fixes/fixed,
          # resolve/resolves/resolved; any case; optional colon; `#N` or this
          # repo's `owner/repo#N`; one reference per keyword, as on GitHub.
          NUMBERS=$(node - <<'JS'
          const PATTERN =
            /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)(?::\s*|\s+)(?:([\w.-]+\/[\w.-]+))?#(\d+)\b/gi;
          const repo = (process.env.REPO ?? "").toLowerCase();
          const numbers = new Set();
          for (const [, ref, n] of (process.env.BODY ?? "").matchAll(PATTERN)) {
            if (ref && ref.toLowerCase() !== repo) continue;
            numbers.add(Number(n));
          }
          console.log([...numbers].sort((a, b) => a - b).join(" "));
          JS
          )
          for n in $NUMBERS; do
            if ! info=$(gh issue view "$n" --repo "$REPO" --json state,url --jq '.state + " " + .url' 2>/dev/null); then
              echo "#$n: not found, skipping"
              continue
            fi
            state=${info%% *}
            url=${info#* }
            case "$url" in
              */issues/*) ;;
              *) echo "#$n is a pull request, skipping"; continue ;;
            esac
            if [ "$state" != "OPEN" ]; then
              echo "#$n is already closed"
              continue
            fi
            gh issue close "$n" --repo "$REPO" \
              --comment "Closed by #$PR_NUMBER, merged into \`$BASE_REF\`. GitHub only closes referenced issues on the default branch."
            echo "#$n closed"
          done
