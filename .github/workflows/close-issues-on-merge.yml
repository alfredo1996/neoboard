# Close referenced issues when a PR merges into a non-default branch (#1853).
#
# GitHub acts on `Closes #N` only for the default branch (dev), so every
# release/* merge left its issues open and they were closed by hand.
#
# pull_request_target runs with this repository's token, so PRs from forks are
# handled too. That is safe here only because the job never runs PR code:
#   - it checks out the BASE branch, which already contains the merged,
#     reviewed code, and installs nothing;
#   - the PR body reaches the parser through an env var, never inlined into a
#     shell command;
#   - the only values the shell loops over are integers the parser printed.
# scripts/__tests__/close-issues-workflow.test.mjs pins all of this.
name: Close referenced issues

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  issues: write

jobs:
  close:
    name: Close referenced issues
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          persist-credentials: false

      - name: Close each referenced issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          for n in $(node scripts/ci/closing-refs.mjs); do
            if ! info=$(gh issue view "$n" --repo "$REPO" --json state,url --jq '.state + " " + .url' 2>/dev/null); then
              echo "#$n: not found, skipping"
              continue
            fi
            state=${info%% *}
            url=${info#* }
            case "$url" in
              */issues/*) ;;
              *) echo "#$n is a pull request, skipping"; continue ;;
            esac
            if [ "$state" != "OPEN" ]; then
              echo "#$n is already closed"
              continue
            fi
            gh issue close "$n" --repo "$REPO" \
              --comment "Closed by #$PR_NUMBER, merged into \`$BASE_REF\`. GitHub only closes referenced issues on the default branch."
            echo "#$n closed"
          done
