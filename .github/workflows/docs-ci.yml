# Docs site build check (#975) — a broken .mdx or Starlight regression was
# previously only discoverable at deploy time. Separate workflow so docs-only
# changes don't trigger the full CI matrix (E2E shards etc.).
name: Docs

on:
  push:
    branches: [main, dev, 'release/*']
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
  pull_request:
    branches: [main, dev, 'release/*']
    paths:
      - 'docs/**'
      - '.github/workflows/docs-ci.yml'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: Docs build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        run: npm ci --prefix docs

      - name: Build docs site
        run: npm run build --prefix docs

      # The brand (#1319) is unlayered CSS over Starlight's variables: this
      # holds it to component/design-tokens.css, to the variable names the
      # installed Starlight still reads, and to what the build emitted.
      - name: Fail if the build lost the brand
        run: node --test scripts/__tests__/docs-brand.node-test.mjs
        env:
          DOCS_BUILT: '1'

      # `astro build` exits 0 even when the `docs` collection resolves empty —
      # it emits a lone 404 page and mentions "The collection "docs" does not
      # exist or is empty" in passing. That is exactly what the Starlight 0.41
      # upgrade did before the content loader was added (#1461), and with the
      # site not yet deployed (#1318) nobody would have noticed. A green build
      # is not evidence the site has content.
      - name: Fail if the build emitted no content
        run: |
          pages=$(find docs/dist -name '*.html' | wc -l | tr -d ' ')
          echo "emitted $pages HTML pages"
          if [ "$pages" -lt 10 ]; then
            echo "::error::Docs build emitted only $pages page(s) — the content collection is probably empty."
            exit 1
          fi

  # scripts/__tests__/docs-accuracy.test.mjs holds the pages to the source —
  # among other things it typechecks the connector-author page's code blocks
  # against the SDK (#1697). ci.yml runs it, but ci.yml does not trigger on
  # docs/**, so a PR that edited only a page ran none of it. It needs the root
  # install (vitest, TypeScript), not the docs one.
  docs-accuracy:
    name: Docs accuracy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check the pages against the source
        run: npx vitest run scripts/__tests__/docs-accuracy.test.mjs
