name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the fields below so we can reproduce and fix it.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug.
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NeoBoard Version
      description: Which version are you running? (check the Settings page or package.json)
      placeholder: e.g. 1.0.0

  - type: dropdown
    id: database
    attributes:
      label: Database Type
      description: Which database connector is involved?
      options:
        - Neo4j
        - PostgreSQL
        - Both
        - Not applicable

  - type: input
    id: environment
    attributes:
      label: Browser / OS
      description: Your browser and operating system.
      placeholder: e.g. Chrome 125 on macOS 15

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
      placeholder: Drag and drop images here
